name: 공고 알림

on:
  schedule:
    # 10분마다 (GitHub 사정에 따라 몇 분 늦게 실행될 수 있습니다)
    - cron: "*/10 * * * *"
  workflow_dispatch:      # 저장소 Actions 탭에서 손으로도 돌릴 수 있게

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 공고 확인 및 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEOPLE: ${{ secrets.PEOPLE }}
          EXCLUDE: ${{ secrets.EXCLUDE }}
          # KDRI 는 여기서 봇 검사에 막힌다. GitHub 은 엘리드·아이올로지를 맡고
          # KDRI 는 집 PC 에서 확인한다.
          SITES: ellead,aioloz,thekrc
        run: python watch.py

      - name: 확인한 공고 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f seen.json ] || { echo "기록 파일이 없어 저장 생략"; exit 0; }
          # 이 사이 main 이 앞서 나갔을 수 있다 (파일을 직접 올렸거나, 예전 실행을
          # 재실행한 경우). 최신 main 위에 seen.json 만 다시 얹어야 push 가 통한다.
          cp seen.json /tmp/seen.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/seen.json seen.json
          git add seen.json
          if git diff --staged --quiet; then
            echo "바뀐 내용 없음 — 저장 생략"
          else
            git commit -m "chore: 확인한 공고 기록 갱신"
            git push origin HEAD:main
          fi
